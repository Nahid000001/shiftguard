<!DOCTYPE html>
<html lang="en-gb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · ShiftGuard</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --danger: #f87171; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 2rem; width: 100%; max-width: 340px; }
        h1 { font-size: 1.3rem; margin: 0 0 1.25rem; color: var(--accent); }
        label { display: block; margin-bottom: 0.25rem; color: var(--muted); font-size: 0.85rem; }
        input { width: 100%; padding: 0.55rem; border-radius: 6px; border: 1px solid var(--border); background: #0b1220; color: var(--text); margin-bottom: 1rem; }
        .password-field { position: relative; }
        .password-field input { padding-right: 3.2rem; }
        .toggle-password { position: absolute; right: 0.4rem; top: 0.4rem; background: none; border: none; color: var(--muted); font-size: 0.75rem; font-weight: 600; cursor: pointer; padding: 0.3rem 0.5rem; }
        .toggle-password:hover { color: var(--accent); }
        button[type="submit"] { width: 100%; background: var(--accent); color: #0f172a; border: none; padding: 0.6rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .errorlist { color: var(--danger); list-style: none; padding: 0; font-size: 0.85rem; }
        .switch-link { margin-top: 1rem; text-align: center; font-size: 0.85rem; color: var(--muted); }
        .switch-link a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="card">
        <h1>ShiftGuard</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="id_username">Username</label>
            {{ form.username }}
            {{ form.username.errors }}
            <label for="id_password">Password</label>
            <div class="password-field">
                {{ form.password }}
                <button type="button" class="toggle-password" data-target="id_password">Show</button>
            </div>
            {{ form.password.errors }}
            <button type="submit">Sign in</button>
        </form>
        <div class="switch-link"><a href="{% url 'password_reset' %}">Forgot your password?</a></div>
        <div class="switch-link">Don't have an account? <a href="{% url 'register' %}">Register</a></div>
    </div>
    <script>
        document.querySelectorAll(".toggle-password").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const input = document.getElementById(btn.dataset.target);
                const showing = input.type === "text";
                input.type = showing ? "password" : "text";
                btn.textContent = showing ? "Show" : "Hide";
            });
        });
    </script>
</body>
</html>
