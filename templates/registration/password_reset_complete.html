<!DOCTYPE html>
<html lang="en-gb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password updated · ShiftGuard</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --good: #34d399; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 2rem; width: 100%; max-width: 340px; text-align: center; }
        h1 { font-size: 1.2rem; margin: 0 0 0.75rem; color: var(--good); }
        p { color: var(--muted); font-size: 0.9rem; }
        a.btn { display: inline-block; margin-top: 1rem; background: var(--accent); color: #0f172a; text-decoration: none; padding: 0.55rem 1.1rem; border-radius: 6px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Password updated</h1>
        <p>You can now sign in with your new password.</p>
        <a class="btn" href="{% url 'login' %}">Sign in</a>
    </div>
</body>
</html>
