<!DOCTYPE html>
<html lang="en-gb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password · ShiftGuard</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --danger: #f87171; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 2rem; width: 100%; max-width: 340px; }
        h1 { font-size: 1.3rem; margin: 0 0 0.75rem; color: var(--accent); }
        p.intro { color: var(--muted); font-size: 0.85rem; margin: 0 0 1.25rem; }
        label { display: block; margin-bottom: 0.25rem; color: var(--muted); font-size: 0.85rem; }
        input { width: 100%; padding: 0.55rem; border-radius: 6px; border: 1px solid var(--border); background: #0b1220; color: var(--text); margin-bottom: 1rem; }
        button { width: 100%; background: var(--accent); color: #0f172a; border: none; padding: 0.6rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .errorlist { color: var(--danger); list-style: none; padding: 0; font-size: 0.85rem; }
        .switch-link { margin-top: 1rem; text-align: center; font-size: 0.85rem; color: var(--muted); }
        .switch-link a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reset your password</h1>
        <p class="intro">Enter the email on your account and we'll send you a link to set a new password.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="{{ form.email.id_for_label }}">Email</label>
            {{ form.email }}
            {{ form.email.errors }}
            <button type="submit">Send reset link</button>
        </form>
        <div class="switch-link">Remembered it? <a href="{% url 'login' %}">Sign in</a></div>
    </div>
</body>
</html>
