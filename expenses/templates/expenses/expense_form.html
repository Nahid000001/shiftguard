{% extends "base.html" %}
{% block title %}{% if form.instance.pk %}Edit{% else %}Add{% endif %} expense · ShiftGuard{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Edit{% else %}Add{% endif %} expense</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
    <a class="btn secondary" href="{% url 'expenses:list' %}">Cancel</a>
</form>
{% endblock %}
