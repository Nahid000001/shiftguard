{% extends "base.html" %}
{% block title %}Delete shift · ShiftGuard{% endblock %}
{% block content %}
<h1>Delete shift on {{ object.date }} at {{ object.site.name }}?</h1>
<form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Delete</button>
    <a class="btn secondary" href="{% url 'shifts:list' %}">Cancel</a>
</form>
{% endblock %}
