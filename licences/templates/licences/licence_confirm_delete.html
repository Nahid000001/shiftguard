{% extends "base.html" %}
{% block title %}Delete licence · ShiftGuard{% endblock %}
{% block content %}
<h1>Delete "{{ object.name }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Delete</button>
    <a class="btn secondary" href="{% url 'licences:list' %}">Cancel</a>
</form>
{% endblock %}
