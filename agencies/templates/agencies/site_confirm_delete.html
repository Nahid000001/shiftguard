{% extends "base.html" %}
{% block title %}Delete site · ShiftGuard{% endblock %}
{% block content %}
<h1>Delete "{{ object.name }}"?</h1>
<p>This will also delete all of its shifts.</p>
<form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Delete</button>
    <a class="btn secondary" href="{% url 'agencies:site-list' %}">Cancel</a>
</form>
{% endblock %}
